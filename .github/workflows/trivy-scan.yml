name: DevSecOps validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediated-quality-gate:
    name: Remediated app tests and policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/remediated/requirements-dev.txt

      - name: Install pinned test dependencies
        run: python -m pip install --requirement app/remediated/requirements-dev.txt

      - name: Run remediation regression tests
        run: pytest -q app/remediated/tests

      - name: Run Bandit on the remediated target
        run: bandit -q -r app/remediated -x app/remediated/tests

      - name: Validate repository security defaults
        run: python scripts/validate_repository.py

  vulnerable-evidence:
    name: Vulnerable image evidence (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build intentionally vulnerable image
        run: docker build --tag vulnerable-flask-app:${{ github.sha }} app/backend

      - name: Report expected vulnerable findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vulnerable-flask-app:${{ github.sha }}
          format: table
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

  remediated-container-gate:
    name: Remediated image security gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build remediated image
        run: docker build --tag remediated-flask-app:${{ github.sha }} app/remediated

      - name: Block on remediated HIGH or CRITICAL findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: remediated-flask-app:${{ github.sha }}
          format: table
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  terraform-validation:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform -chdir=terraform validate -no-color
