name: DevSecOps AppSec Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    name: Build Image and Scan with Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          # We must navigate to the backend directory where the Dockerfile lives
          cd app/backend
          docker build -t vulnerable-flask-app:${{ github.sha }} .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vulnerable-flask-app:${{ github.sha }}'
          format: 'table'
          # This app is intentionally vulnerable for portfolio/lab purposes.
          # Trivy still reports HIGH and CRITICAL findings, but this branch
          # stays green so the repo does not look accidentally broken.
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          # Ignore unpatched vulnerabilities to reduce friction with developers
          ignore-unfixed: true
