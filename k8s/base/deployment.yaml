apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediated-flask-app
  labels:
    app.kubernetes.io/name: remediated-flask-app
    app.kubernetes.io/part-of: devsecops-comparison-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: remediated-flask-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remediated-flask-app
        app.kubernetes.io/part-of: devsecops-comparison-lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flask-container
          image: devsecops-flask-app:remediated
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: SPLUNK_HEC_URL
              valueFrom:
                configMapKeyRef:
                  name: runtime-logging
                  key: splunkHecUrl
                  optional: true
            - name: SPLUNK_HEC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runtime-logging
                  key: splunkHecToken
                  optional: true
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
